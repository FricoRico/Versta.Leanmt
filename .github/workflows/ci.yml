name: build-and-test

on:
  # Every push is CI-checked, not just main: with a small team, branches
  # reviewed via PR must arrive with green CI already attached.
  push: {}
  pull_request:
    branches: [main]
  # Lets any leg be run on demand from the Actions tab (e.g. before a PR is
  # opened). No effect unless invoked.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # commit comments: bench results + failure-log excerpts
  pull-requests: write # benchmark results comment on PRs
  issues: write # issues.createComment targets the PR number (issues API)

env:
  CMAKE_BUILD_TYPE: Release

# `shell: bash` expands to `bash --noprofile --norc -eo pipefail` — pipefail
# is the load-bearing part: steps like `cmake --build build | tee build.log`
# otherwise exit 0 whenever tee does, which already masked a real compile
# failure once (run 38433604756: arm64 build red, step green). Never drop
# this default.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Warning-gated compile matrix over the ABIs the app ships and the NDK
  # versions we support (27.x tested on 27.3, 28.x tested on 28.1 — the app's
  # pinned NDK). leanmt's own sources build with -Werror on.
  #
  # NDKs are installed from Google's pinned dl.google.com zips (sha1-verified
  # against the values published in Google's repository manifest), not via
  # sdkmanager: android-actions/setup-android@v3 breaks on the forced Node 24
  # runner runtime (all legs failed at that step on the first real run), and
  # old NDK patch releases get de-listed from the sdkmanager channel while the
  # zips stay valid. Runner's own cmake + ninja are used; version is echoed
  # for traceability.
  # ---------------------------------------------------------------------------
  android-build:
    name: android ${{ matrix.abi }} / NDK ${{ matrix.ndk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        ndk: ["27.3.13750724", "28.1.13356709"]
        include:
          - ndk: "27.3.13750724"
            ndk_rel: r27d
            ndk_sha1: 22105e410cf29afcf163760cc95522b9fb981121
          - ndk: "28.1.13356709"
            ndk_rel: r28b
            ndk_sha1: f574d3165405bd59ffc5edaadac02689075a729f
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned NDK ${{ matrix.ndk }} (${{ matrix.ndk_rel }})
        run: |
          set -x
          curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${{ matrix.ndk_rel }}-linux.zip"
          echo "${{ matrix.ndk_sha1 }}  $RUNNER_TEMP/ndk.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/ndk.zip"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${{ matrix.ndk_rel }}" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/android-ndk-${{ matrix.ndk_rel }}/ndk-build" --version | head -2
          cmake --version | head -1

      - name: Configure (${{ matrix.abi }})
        run: |
          FLAGS="-DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-28"
          case "${{ matrix.abi }}" in
            arm64-v8a) FLAGS="$FLAGS -DUSE_NEON=ON -DLEANMT_ARM64_TUNE=ON" ;;
            x86|x86_64) FLAGS="$FLAGS -DUSE_SSE2=ON" ;;
          esac
          cmake -G Ninja -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release $FLAGS

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      # Diagnostics land in git notes (pure git push — readable by anyone with
      # repo access via `git fetch origin refs/notes/*:refs/notes/*`, unlike
      # run logs/artifacts which need API admin rights).
      - name: Publish failure log to git notes
        if: failure()
        env:
          NOTES_REF: ci-failures-android-${{ matrix.abi }}-ndk${{ matrix.ndk }}
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" || true
          { echo "job: $NOTES_REF run $GITHUB_RUN_ID"; tail -n 250 build.log; } \
            | git notes --ref "$NOTES_REF" add -f -F - "$GITHUB_SHA"
          git push origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" \
            || echo "::warning:: notes push failed (diagnostics only)"

  # ---------------------------------------------------------------------------
  # Host unit tests, x86_64 (SSE2 dispatch path).
  # ---------------------------------------------------------------------------
  host-test:
    name: host x86_64 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache model fixtures
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: leanmt-fixtures-ende-tiny11-v2-93821e13b3c511b5-enja-v2.3-59ae659f9bb63e4f

      - name: Download fixture models (pinned sha256)
        run: tests/fixtures/download-fixtures.sh

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_SSE2=ON -DLEANMT_BUILD_TESTS=ON -DLEANMT_BUILD_BENCH=ON

      - name: Build
        run: cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      - name: Publish failure log to git notes
        if: failure()
        env:
          NOTES_REF: ci-failures-host-x86_64
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" || true
          { echo "job: $NOTES_REF run $GITHUB_RUN_ID"; \
            if [ -f test.log ]; then tail -n 250 test.log; else tail -n 250 build.log; fi; } \
            | git notes --ref "$NOTES_REF" add -f -F - "$GITHUB_SHA"
          git push origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" \
            || echo "::warning:: notes push failed (diagnostics only)"

  # ---------------------------------------------------------------------------
  # Host tests + NEON path on a native arm64 runner (ubuntu-24.04-arm is an
  # aarch64 machine — real NEON kernels, no cross-compile emulation), followed
  # by the latency/RSS benchmark. Results are published as a PR comment on PR
  # builds and as a commit comment on push builds (both anonymous-API
  # readable, unlike artifacts/logs which need auth).
  # ---------------------------------------------------------------------------
  arm64-test-bench:
    name: arm64 tests + benchmark
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache model fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: leanmt-fixtures-ende-tiny11-v2-93821e13b3c511b5-enja-v2.3-59ae659f9bb63e4f

      - name: Download fixture models (pinned sha256)
        run: tests/fixtures/download-fixtures.sh

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NEON=ON -DLEANMT_BUILD_TESTS=ON -DLEANMT_BUILD_BENCH=ON

      - name: Build
        run: cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      - name: Publish failure log to git notes
        if: failure()
        env:
          NOTES_REF: ci-failures-arm64-test-bench
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" || true
          { echo "job: $NOTES_REF run $GITHUB_RUN_ID"; \
            if [ -f test.log ]; then tail -n 250 test.log; else tail -n 250 build.log; fi; } \
            | git notes --ref "$NOTES_REF" add -f -F - "$GITHUB_SHA"
          git push origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" \
            || echo "::warning:: notes push failed (diagnostics only)"

      - name: Benchmark
        run: |
          F=tests/fixtures/models/ende.student.tiny11
          test -x ./build/bench/leanmt-bench  # build silently incomplete != green bench
          ./build/bench/leanmt-bench \
            --model "$F/model.intgemm.alphas.bin" \
            --vocab "$F/vocab.deen.spm" \
            --shortlist "$F/lex.s2t.bin" \
            --iterations 30 --warmup 5 \
            --json bench-results.json | tee bench-table.md
          #publish step reads both files; fail here, not in a JS stack trace
          test -s bench-results.json
          test -s bench-table.md

      - name: Publish benchmark table to step summary
        run: |
          {
            echo "### leanmt benchmark — ${{ github.sha }} (ubuntu-24.04-arm, NEON, single thread)"
            echo ""
            cat bench-table.md
            echo ""
            echo "_Fixture: ende.student.tiny11 v2, sha256-pinned._"
            echo "_Regression baselines live in bench/baselines/ (see README there)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: leanmt-bench-${{ github.sha }}
          path: |
            bench-results.json
            bench-table.md
          if-no-files-found: error

      # Primary publication channel with no auth required on the read side:
      # `git notes` under refs/notes/bench-arm64, keyed by commit. Fetch with
      # `git fetch origin refs/notes/bench-arm64:refs/notes/bench-arm64`.
      - name: Publish bench JSON to git notes
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/bench-arm64:refs/notes/bench-arm64" || true
          git notes --ref bench-arm64 add -f -F bench-results.json "$GITHUB_SHA"
          git push origin "refs/notes/bench-arm64:refs/notes/bench-arm64" \
            || echo "::warning:: bench notes push failed"

      - name: Publish benchmark results as comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('bench-table.md', 'utf8');
            // Embed the raw JSON so the numbers are recoverable from the public
            // comment itself — artifact downloads need API auth, comments
            // don't. bench/baselines/arm64.json is sourced from this.
            const json = fs.readFileSync('bench-results.json', 'utf8');
            const body = [
              '### leanmt benchmark (' + context.sha.slice(0, 7) + ')',
              '',
              'Reference arm64 runner (`ubuntu-24.04-arm`), NEON, single thread,',
              'pinned `ende.student.tiny11` fixture (sha256-verified), translation',
              'cache disabled for the measurement.',
              '',
              table,
              '',
              '<details><summary>bench-results.json (raw)</summary>',
              '',
              '```json',
              json.trim(),
              '```',
              '</details>',
              '',
              '_Source: benchmark harness `bench/leanmt-bench` (NEU-16). ',
              'Baselines: `bench/baselines/` — see the README there._',
            ].join('\n');
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
            }
