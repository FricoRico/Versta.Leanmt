name: build-and-test

on:
  # Every push is CI-checked, not just main: with a small team, branches
  # reviewed via PR must arrive with green CI already attached.
  push: {}
  pull_request:
    branches: [main]
  # Lets any leg be run on demand from the Actions tab (e.g. before a PR is
  # opened). No effect unless invoked.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # commit comments: bench results + failure-log excerpts
  pull-requests: write # benchmark results comment on PRs
  issues: write # issues.createComment targets the PR number (issues API)

env:
  CMAKE_BUILD_TYPE: Release
  # Runner-image drift guard (NEU-157): cmake 4.0 removed compatibility with
  # `cmake_minimum_required(VERSION < 3.5)`, and bundled
  # third_party/sentencepiece still declares 3.1. When ubuntu-latest rolled
  # from cmake 3.x to 4.x (2026-10-27), every Configure step below started
  # failing repo-wide — the android legs too, because they deliberately use
  # the runner's cmake (see the android-build header comment), not the
  # NDK-bundled one. CMAKE_POLICY_VERSION_MINIMUM is cmake 4's official
  # escape hatch for exactly this case; as an environment variable it
  # initializes the cache entry in every new build tree, so one setting here
  # covers all current and future configure invocations uniformly. cmake < 4
  # ignores it, so the self-hosted arm64 image is unaffected. Remove it when
  # the sentencepiece pin is bumped to a release requiring cmake >= 3.5.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

# `shell: bash` expands to `bash --noprofile --norc -eo pipefail` — pipefail
# is the load-bearing part: steps like `cmake --build build | tee build.log`
# otherwise exit 0 whenever tee does, which already masked a real compile
# failure once (run 38433604756: arm64 build red, step green). Never drop
# this default.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Warning-gated compile matrix over the ABIs the app ships and the NDK
  # versions we support (27.x tested on 27.3, 28.x tested on 28.1 — the app's
  # pinned NDK). leanmt's own sources build with -Werror on.
  #
  # NDKs are installed from Google's pinned dl.google.com zips (sha1-verified
  # against the values published in Google's repository manifest), not via
  # sdkmanager: android-actions/setup-android@v3 breaks on the forced Node 24
  # runner runtime (all legs failed at that step on the first real run), and
  # old NDK patch releases get de-listed from the sdkmanager channel while the
  # zips stay valid. Runner's own cmake + ninja are used; version is echoed
  # for traceability.
  # ---------------------------------------------------------------------------
  android-build:
    name: android ${{ matrix.abi }} / NDK ${{ matrix.ndk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        ndk: ["27.3.13750724", "28.1.13356709"]
        include:
          - ndk: "27.3.13750724"
            ndk_rel: r27d
            ndk_sha1: 22105e410cf29afcf163760cc95522b9fb981121
          - ndk: "28.1.13356709"
            ndk_rel: r28b
            ndk_sha1: f574d3165405bd59ffc5edaadac02689075a729f
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned NDK ${{ matrix.ndk }} (${{ matrix.ndk_rel }})
        run: |
          set -x
          curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${{ matrix.ndk_rel }}-linux.zip"
          echo "${{ matrix.ndk_sha1 }}  $RUNNER_TEMP/ndk.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/ndk.zip"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${{ matrix.ndk_rel }}" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/android-ndk-${{ matrix.ndk_rel }}/ndk-build" --version | head -2
          cmake --version | head -1

      - name: Configure (${{ matrix.abi }})
        run: |
          FLAGS="-DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-28"
          case "${{ matrix.abi }}" in
            arm64-v8a) FLAGS="$FLAGS -DUSE_NEON=ON -DLEANMT_ARM64_TUNE=ON" ;;
            x86|x86_64) FLAGS="$FLAGS -DUSE_SSE2=ON" ;;
          esac
          cmake -G Ninja -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release $FLAGS

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      # Diagnostics land in git notes (pure git push — readable by anyone with
      # repo access via `git fetch origin refs/notes/*:refs/notes/*`, unlike
      # run logs/artifacts which need API admin rights).
      - name: Publish failure log to git notes
        if: failure()
        env:
          NOTES_REF: ci-failures-android-${{ matrix.abi }}-ndk${{ matrix.ndk }}
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" || true
          { echo "job: $NOTES_REF run $GITHUB_RUN_ID"; tail -n 250 build.log; } \
            | git notes --ref "$NOTES_REF" add -f -F - "$GITHUB_SHA"
          git push origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" \
            || echo "::warning:: notes push failed (diagnostics only)"

  # ---------------------------------------------------------------------------
  # Host unit tests, x86_64 (SSE2 dispatch path).
  # ---------------------------------------------------------------------------
  host-test:
    name: host x86_64 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache model fixture
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: leanmt-fixture-ende-tiny11-v2-93821e13b3c511b5

      - name: Download fixture model (pinned sha256)
        run: tests/fixtures/download-fixtures.sh

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_SSE2=ON -DLEANMT_BUILD_TESTS=ON -DLEANMT_BUILD_BENCH=ON -DLEANMT_BUILD_PROBE=ON

      - name: Build
        run: cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      # Pack-acceptance probe smoke (NEU-60): the Versta.Models acceptance
      # harness consumes this binary; catch contract drift at the source.
      - name: Probe smoke
        run: |
          F=tests/fixtures/models/ende.student.tiny11
          printf 'The ticket costs 12 euros.\n' > probe-smoke.txt
          ./build/probe/leanmt-probe \
            --model "$F/model.intgemm.alphas.bin" \
            --vocab "$F/vocab.deen.spm" \
            --shortlist "$F/lex.s2t.bin" \
            --encoder_layers 6 --decoder_layers 2 --ffn_depth 2 --num_heads 8 \
            --probes probe-smoke.txt --json probe-smoke.json
          test -s probe-smoke.json
          grep -q '"load_ok": true' probe-smoke.json

      - name: Publish failure log to git notes
        if: failure()
        env:
          NOTES_REF: ci-failures-host-x86_64
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" || true
          { echo "job: $NOTES_REF run $GITHUB_RUN_ID"; \
            if [ -f test.log ]; then tail -n 250 test.log; else tail -n 250 build.log; fi; } \
            | git notes --ref "$NOTES_REF" add -f -F - "$GITHUB_SHA"
          git push origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" \
            || echo "::warning:: notes push failed (diagnostics only)"

  # ---------------------------------------------------------------------------
  # Host tests + NEON path on a native arm64 runner (ubuntu-24.04-arm is an
  # aarch64 machine — real NEON kernels, no cross-compile emulation), followed
  # by the latency/RSS benchmark. Results are published as a PR comment on PR
  # builds and as a commit comment on push builds (both anonymous-API
  # readable, unlike artifacts/logs which need auth).
  # ---------------------------------------------------------------------------
  arm64-test-bench:
    name: arm64 tests + benchmark
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache model fixture
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: leanmt-fixture-ende-tiny11-v2-93821e13b3c511b5

      - name: Download fixture model (pinned sha256)
        run: tests/fixtures/download-fixtures.sh

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_NEON=ON -DLEANMT_BUILD_TESTS=ON -DLEANMT_BUILD_BENCH=ON -DLEANMT_BUILD_PROBE=ON

      - name: Build
        run: cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      # Same probe smoke as host-test, here on real NEON (the acceptance
      # harness's canonical runner arch is arm64 — see Versta.Models
      # pack-acceptance workflow).
      - name: Probe smoke
        run: |
          F=tests/fixtures/models/ende.student.tiny11
          printf 'The ticket costs 12 euros.\n' > probe-smoke.txt
          ./build/probe/leanmt-probe \
            --model "$F/model.intgemm.alphas.bin" \
            --vocab "$F/vocab.deen.spm" \
            --shortlist "$F/lex.s2t.bin" \
            --encoder_layers 6 --decoder_layers 2 --ffn_depth 2 --num_heads 8 \
            --probes probe-smoke.txt --json probe-smoke.json
          test -s probe-smoke.json
          grep -q '"load_ok": true' probe-smoke.json

      - name: Publish failure log to git notes
        if: failure()
        env:
          NOTES_REF: ci-failures-arm64-test-bench
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" || true
          { echo "job: $NOTES_REF run $GITHUB_RUN_ID"; \
            if [ -f test.log ]; then tail -n 250 test.log; else tail -n 250 build.log; fi; } \
            | git notes --ref "$NOTES_REF" add -f -F - "$GITHUB_SHA"
          git push origin "refs/notes/$NOTES_REF:refs/notes/$NOTES_REF" \
            || echo "::warning:: notes push failed (diagnostics only)"

      - name: Benchmark
        run: |
          F=tests/fixtures/models/ende.student.tiny11
          test -x ./build/bench/leanmt-bench  # build silently incomplete != green bench
          ./build/bench/leanmt-bench \
            --model "$F/model.intgemm.alphas.bin" \
            --vocab "$F/vocab.deen.spm" \
            --shortlist "$F/lex.s2t.bin" \
            --iterations 30 --warmup 5 \
            --json bench-results.json | tee bench-table.md
          #publish step reads both files; fail here, not in a JS stack trace
          test -s bench-results.json
          test -s bench-table.md

      # NEU-23 tuning instrument: ruy intra-op thread-pool sizing and batched
      # decode. Runs only on PRs; push builds keep the single canonical bench
      # above (batch 1 at the shipped default thread count) so its published
      # numbers stay regression-comparable across merges. The sweep informs
      # Model::Config.threads and gemv coverage decisions; it does not gate.
      - name: Benchmark thread/batch sweep (PR only)
        if: github.event_name == 'pull_request'
        run: |
          F=tests/fixtures/models/ende.student.tiny11
          : > bench-sweep.md
          : > bench-sweep-files.txt
          for T in 1 2 4; do
            for B in 1 4 8; do
              J="bench-sweep-t${T}-b${B}.json"
              ./build/bench/leanmt-bench \
                --model "$F/model.intgemm.alphas.bin" \
                --vocab "$F/vocab.deen.spm" \
                --shortlist "$F/lex.s2t.bin" \
                --iterations 25 --warmup 5 \
                --threads "$T" --batch "$B" \
                --json "$J" | sed '1d' >> bench-sweep.md
              echo "$J" >> bench-sweep-files.txt
            done
          done

      - name: Publish sweep to step summary (PR only)
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### leanmt thread/batch sweep — ${{ github.sha }} (ubuntu-24.04-arm)"
            echo ""
            cat bench-sweep.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep JSON (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: leanmt-bench-sweep-${{ github.sha }}
          path: |
            bench-sweep.md
            bench-sweep-t*-b*.json
          if-no-files-found: error

      - name: Publish sweep as PR comment (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sweep = fs.readFileSync('bench-sweep.md', 'utf8');
            const body = [
              '### leanmt thread/batch sweep (' + context.sha.slice(0, 7) + ')',
              '',
              'Reference arm64 runner, NEON, pinned fixture, cache disabled.',
              'ruy intra-op threads (`--threads`) x batch (`--batch`). The',
              'canonical default-config baseline table is the separate',
              'benchmark comment; this sweep is how `Model::Config.threads`',
              'defaults get chosen (NEU-23).',
              '',
              sweep,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Publish benchmark table to step summary
        run: |
          {
            echo "### leanmt benchmark — ${{ github.sha }} (ubuntu-24.04-arm, NEON, default ruy threads)"
            echo ""
            cat bench-table.md
            echo ""
            echo "_Fixture: ende.student.tiny11 v2, sha256-pinned._"
            echo "_Regression baselines live in bench/baselines/ (see README there)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: leanmt-bench-${{ github.sha }}
          path: |
            bench-results.json
            bench-table.md
          if-no-files-found: error

      # Primary publication channel with no auth required on the read side:
      # `git notes` under refs/notes/bench-arm64, keyed by commit. Fetch with
      # `git fetch origin refs/notes/bench-arm64:refs/notes/bench-arm64`.
      - name: Publish bench JSON to git notes
        run: |
          git config user.name "leanmt-ci"
          git config user.email "leanmt-ci@localhost"
          git fetch origin "refs/notes/bench-arm64:refs/notes/bench-arm64" || true
          git notes --ref bench-arm64 add -f -F bench-results.json "$GITHUB_SHA"
          git push origin "refs/notes/bench-arm64:refs/notes/bench-arm64" \
            || echo "::warning:: bench notes push failed"

      - name: Publish benchmark results as comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('bench-table.md', 'utf8');
            // Embed the raw JSON so the numbers are recoverable from the public
            // comment itself — artifact downloads need API auth, comments
            // don't. bench/baselines/arm64.json is sourced from this.
            const json = fs.readFileSync('bench-results.json', 'utf8');
            const body = [
              '### leanmt benchmark (' + context.sha.slice(0, 7) + ')',
              '',
              'Reference arm64 runner (`ubuntu-24.04-arm`), NEON, default ruy',
              'pinned `ende.student.tiny11` fixture (sha256-verified), translation',
              'cache disabled for the measurement.',
              '',
              table,
              '',
              '<details><summary>bench-results.json (raw)</summary>',
              '',
              '```json',
              json.trim(),
              '```',
              '</details>',
              '',
              '_Source: benchmark harness `bench/leanmt-bench` (NEU-16). ',
              'Baselines: `bench/baselines/` — see the README there._',
            ].join('\n');
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # Single stable check name for branch protection on main. Required checks
  # are matched by exact job name; the android-build legs embed ABI/NDK matrix
  # values, so any matrix edit would silently rename those checks and un-gate
  # main. Require only this aggregate; it covers every leg above.
  # `if: always()` so a failed leg fails the gate instead of skipping it.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    needs: [android-build, host-test, arm64-test-bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required leg succeeded
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: leg["result"] for name, leg in needs.items() if leg["result"] != "success"}
          if bad:
              for name, result in sorted(bad.items()):
                  print(f"::error::{name}: {result}")
              sys.exit(1)
          print("All required legs green:", ", ".join(sorted(needs)))
          '
